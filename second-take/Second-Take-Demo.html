## Introduction

Support is easier to lean on when you already know who is actually there. This lesson is about getting honest with yourself, not about having a long list.

## Content

Most people overestimate how many people they can count on, and underestimate the one or two who would show up without being asked. The person who answers the phone at a hard hour matters more than ten names you rarely speak to. Support also comes from places that are not family: a caseworker who returns your calls, a program that keeps its appointments, someone from a group who has been where you are. Write the real names down, even if the list is short. A short honest list is something you can build on. A long hopeful one is not.

## Activity

Answer the three prompts below. One name in each is enough.

## Encouragement

Naming even one person is a real start, and this list can grow.

<!-- lesson-2 -->

## Introduction

If family is not part of your support, that does not leave you without any. This lesson points you to the places built for exactly this moment.

## Content

Reentry programs exist to help with the first weeks out, and they are not doing you a favor by taking your call. That is the work. A program can help with housing, a job search, transport to appointments, and paperwork you cannot sort out on your own. Faith groups often run meals, rides, and check-ins whether or not you are a member, and you can accept help without signing up for anything. Peer mentors are people who have come home themselves, which means they answer the questions that are hard to ask anyone else. Calling one of these does not commit you to anything. It just opens a door.

## Activity

Open one of the resources below and write down one phone number to call this week.

## Encouragement

Reaching out to a program is not starting over. It is using what is there.

<!-- lesson-3 -->

## Introduction

The hardest part of asking for help is usually the asking, not the help. A short, clear message takes most of the weight out of it.

## Content

People say yes more often to a specific, small ask than to an open-ended one. "Can you pick me up Thursday at two" is easier to answer than "I need help." Being clear also protects you, because a vague ask leaves room for a vague answer and a long wait. Say what you need, say when, and say thank you. Leave out the apology. You are not a burden for needing a ride, a phone call, or a couch for one night, and most people would rather be asked directly than guess. If the answer is no, that is information, not a verdict on you. Ask the next person on your list.

## Activity

Write a short message you would actually send. Keep it to three sentences: what you need, when you need it, and thank you.

## Encouragement

Asking clearly is a skill, and you just practiced it.

<!-- lesson-4 -->

## Introduction

A backup plan is not pessimism. It is the difference between a hard day and a crisis.

## Content

Plans fail for ordinary reasons: a phone dies, a ride falls through, someone moves, a program has a waiting list. Having a second name written down means a failed plan costs you an hour instead of a week. Keep both names somewhere that does not depend on a charged battery, like a piece of paper in your wallet. Add 211 to that paper as your third line, since one call reaches housing, food, and transport help in your area no matter which town you are in. Check in with your primary person before you need them, so the first call in months is not also an emergency.

## Activity

Fill in your primary and backup support below, then write both on paper and keep it on you.

## Encouragement

You now have a plan that holds even when one part of it does not.
`,"../content/modules/Release_Day_Checklist.md":`## Introduction

This is the last lesson on your path, and it pulls everything together into one list you can hold in your hand on day one.

## Content

Release day moves fast, and decisions are harder to make well when everything is new at once. A checklist written ahead of time carries the thinking you already did here. Work through the list below and tick off what is true. Anything left unticked is not a failure, it is just your next task, and the resources in this app cover most of them. Print this or write it out on paper before your date. Paper does not need a charged battery, a signal, or a password you cannot remember under pressure.

## Activity

Tick off what is already handled, and write the unticked items on a piece of paper to keep on you.

## Encouragement

You built this path one lesson at a time, and you are walking out with a plan. That is real work, and it was yours.
`,"../content/modules/Talking_About_Your_Record.md":`<!-- lesson-1 -->

## Introduction

Employers ask about a record for a narrower reason than most people expect. Knowing what they are actually listening for takes the fear out of the question.

## Content

An employer asking about your record is usually trying to answer one question: is this a risk to my business today. They are not asking for the full story, and they are not asking you to relive it. What lands is short, honest, and forward-looking: what happened, what you did about it, and what you are doing now. Long explanations tend to sound like excuses even when they are not. Defensiveness reads as risk. A calm two sentences followed by "here is what I have been doing since" reads as someone who has handled it. You also do not owe details. "I was incarcerated" is a complete answer. What you did with the time is the part worth spending your words on.

## Activity

Read the three-part shape once more: what happened, what you did about it, what you are doing now. You will build your own version in the next lesson.

## Encouragement

Understanding the question is most of the work. You have done that part.

<!-- lesson-2 -->

## Introduction

A script you have said out loud beats one you have only thought about. This lesson builds yours in three pieces.

## Content

Keep each piece short. One sentence on what happened, in plain words, with no legal detail and no blame. One sentence on what you did with the time, which is where certificates, work assignments, classes, and programs belong. One sentence on what you want next, tied to the job in front of you. Together that is about thirty seconds, which is the right length. Write it in your own voice, not in words you would never use, because a script that does not sound like you is hard to deliver under pressure. Then say it out loud five times. The goal is not memorizing it. The goal is not being surprised by your own answer.

## Activity

Fill in the three fields below, then read the whole thing out loud once.

## Encouragement

You just built an answer you can use. Saying it out loud is what makes it yours.

<!-- lesson-3 -->

## Introduction

The follow-up question is usually the one that catches people off guard. Practicing a few makes the rest easier.

## Content

Follow-ups are normal and are not a sign the interview is going badly. Often an employer asks more because they are looking for a reason to say yes and need to be able to defend the decision. Three come up most: how long ago was it, what have you been doing since, and what would you do differently. Each has the same shape as your main answer: brief, honest, forward. If a question moves into detail you do not want to give, it is fine to say "I would rather focus on what I have done since, if that works for you." That is a professional answer, not a dodge. And if you do not know, say you do not know rather than filling the silence.

## Activity

Write a short answer to each of the three follow-ups below, in your own words.

## Encouragement

You have now answered the hard questions once. The next time is easier.

<!-- lesson-4 -->

## Introduction

You have rights in a hiring process, and knowing them changes how these conversations feel.

## Content

Federal guidance from the Equal Employment Opportunity Commission says an employer generally cannot rule you out for a record alone. They are expected to consider how serious it was, how long ago it happened, and whether it actually relates to the job. Many states and cities also have fair chance or ban-the-box laws, which stop employers from asking about a record until after a conditional job offer. The rules vary by state, so check your own. Knowing this does not mean opening an interview with your rights. It means walking in understanding that a record is one factor among several, not an automatic no, and recognising when something crosses a line.

## Activity

Open the resource below and read the section that applies to job seekers. Note one thing that surprised you.

## Encouragement

Knowing where you stand is its own kind of confidence.
`,"../content/technology/tech_comp_01.md":`## Introduction

A computer can feel unfamiliar if it's been a while, and that's completely normal. This lesson covers the basics you'll actually use.

## Content

Every computer works off a few consistent basics: a mouse or trackpad to point and click, a keyboard to type, and a desktop screen showing icons for the programs you use most. Opening a program means clicking its icon twice, and closing one means clicking the X in the corner. Saving your work regularly protects it from getting lost, and most programs save automatically if you look for a small "saved" message near the top of the screen.

## Activity

Practice opening one program and closing it again, three times in a row, until the motion feels familiar.

## Encouragement

Every skill on a computer becomes easier the second time you do it.
`,"../content/technology/tech_digi_01.md":`## Introduction

Email is how most employers, programs, and services stay in touch with you. Knowing how to check it, write it, and organize it puts you back in control of your own communication.

## Content

An email works like a digital letter: you write a message, add the recipient's address at the top, and press send. Checking email regularly matters, since job offers, appointment reminders, and program updates often arrive there first. Keeping your inbox organized by deleting messages you don't need, and starring the ones you do, makes it easier to find what matters later.

## Activity

Write a short practice email to yourself, including a subject line, one sentence of body text, and your name at the bottom.

## Encouragement

Every email you send is one more way you're staying connected to what's ahead.
`,"../content/technology/tech_digi_03.md":`## Introduction

The internet holds real opportunity, and it also holds real risk if you don't know what to watch for. This lesson gives you the basics to protect yourself.

## Content

A strong password uses a mix of letters, numbers, and symbols, and it stays different across your important accounts like email and banking. Scam messages often create urgency, asking you to click a link immediately or share personal information right away, so slowing down before clicking anything unfamiliar protects you. Never share a password, social security number, or bank information with anyone who reaches out to you first by text, email, or phone call.

## Activity

Write down one password idea using a mix of letters, numbers, and symbols, without using anything easy to guess like a birthday.

## Encouragement

Protecting your information online is one more way you're taking care of your own future.
`,"../content/technology/tech_phone_01.md":`## Introduction

A phone connects you to job applications, appointments, and the people in your corner. Getting comfortable with the basics now means one less thing to figure out under pressure later.

## Content

Setting up a new phone starts with turning it on and following the prompts for language, Wi-Fi connection, and account creation. Most phones ask you to create or sign into an email account first, since this connects your contacts, photos, and apps together in one place. Take it one screen at a time, and skip anything that asks for payment information until you're ready to add it later.

## Activity

Write down one email address you already have, or one you plan to create this week. Write down one person's phone number you want to save as your first contact.

## Encouragement

Getting your phone set up is one task completely in your control today.
`,"../content/technology/tech_social_02.md":`## Introduction

Most job searches now start online, and knowing how to search well saves real time and reduces frustration.

## Content

Job search sites let you filter by location, job type, and pay range, narrowing results down to what actually fits your life right now. A strong application usually needs a resume uploaded as a file, and sometimes a short cover letter explaining why you're a fit. Applying to multiple positions in one sitting, rather than one at a time over several days, builds momentum and keeps the process from feeling endless.

## Activity

Search one job title you're interested in, and write down two things you notice: one requirement you already meet, and one you want to work toward.

## Encouragement

Every application you send is a real step toward the work you're building.
