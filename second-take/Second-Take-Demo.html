"confident",label:"I use one comfortably",category:"Employment"}]},{id:"q-email",prompt:"Do you have an email address you can get into today?",helper:"An email address is the key to most job applications and benefits sites.",options:[{value:"no",label:"No, I need to set one up",category:"Technology"},{value:"locked-out",label:"I have one but cannot get in",category:"Technology"},{value:"yes",label:"Yes, I can get into it",category:"Employment"}]},{id:"q-work-history",prompt:"When did you last hold a paid job?",helper:"Work history helps us decide how much resume support to show you.",options:[{value:"never",label:"I have not worked for pay before",category:"Employment"},{value:"long-ago",label:"More than five years ago",category:"Employment"},{value:"recent",label:"Within the last five years",category:"Employment"}]},{id:"q-need",prompt:"What would help you most in your first month out?",helper:"Pick the one that feels most urgent right now.",options:[{value:"id-docs",label:"Getting my ID and paperwork sorted",category:"Connections"},{value:"work",label:"Finding steady work",category:"Employment"},{value:"people",label:"Rebuilding family and support ties",category:"Connections"}]},{id:"q-support",prompt:"Who can you call when a day goes sideways?",helper:"Knowing your support list ahead of time takes pressure off later.",options:[{value:"nobody",label:"I am not sure yet",category:"Connections"},{value:"one",label:"One person comes to mind",category:"Connections"},{value:"several",label:"I have a few people",category:"Employment"}]}],interviewQuestions:[{id:"iq-1",question:"Tell me a little about yourself.",tip:"Keep it to about a minute. Where you are from, what you are good at, and what kind of work you want next.",sampleAnswers:["I am someone who shows up early and finishes what I start. I spent the last few years learning kitchen work and I am looking for a steady role where I can keep building on that.","I like hands-on work. I picked up maintenance and repair s
